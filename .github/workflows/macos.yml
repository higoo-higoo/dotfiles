name: macOS
run-name: macOS
on:
  push:
    branches : [ main ]
  pull_request:
    branches : [ main ]

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      # Retry interrupted downloads as well as transient HTTP errors.
      - name: Configure Homebrew download retries
        run: printf 'retry-all-errors\n' > "$RUNNER_TEMP/homebrew.curlrc"
      - name: Run script
        env:
          HOMEBREW_CURLRC: ${{ runner.temp }}/homebrew.curlrc
          HOMEBREW_CURL_RETRIES: "5"
        run: ${GITHUB_WORKSPACE}/run_once_install.sh

